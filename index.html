<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokefiche</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/main.js"></script>

  <!-- Régions aria-live pour les annonces au lecteur d'écran (js/announce.js).
       Doivent exister dès le parsing pour être enregistrées par les AT. -->
  <div id="live-a"   class="sr-only" aria-live="polite"    aria-atomic="true"></div>
  <div id="live-b"   class="sr-only" aria-live="polite"    aria-atomic="true"></div>
  <div id="live-log" class="sr-only" role="log"            aria-live="polite"></div>
  <div id="aria-alert" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
</body>
</html>
